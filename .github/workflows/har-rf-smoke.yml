name: HAR RF smoke check

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/har-rf-smoke.yml"
      - "scripts/verify_har_eda.py"
      - "requirements.txt"
  pull_request:
    paths:
      - ".github/workflows/har-rf-smoke.yml"
      - "scripts/verify_har_eda.py"
      - "requirements.txt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  har-rf:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install RF dependencies
        run: python -m pip install pandas "$(grep '^scikit-learn==' requirements.txt)"

      - name: Generate six-class sensor fixture
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path

          output = Path("smoke-data/data01_train.csv")
          output.parent.mkdir(exist_ok=True)
          labels = ("LAYING", "SITTING", "STANDING", "WALKING",
                    "WALKING_DOWNSTAIRS", "WALKING_UPSTAIRS")
          with output.open("w", encoding="utf-8", newline="") as file:
              writer = csv.writer(file)
              writer.writerow(["subject", "sensor_x", "sensor_y", "Activity"])
              for label_index, label in enumerate(labels):
                  for sample in range(30):
                      writer.writerow([sample % 10, label_index * 10 + sample / 100,
                                       sample % 7, label])
          PY

      - name: Run RF evaluation CLI
        run: python scripts/verify_har_eda.py --data-dir smoke-data --output smoke-results/har.json

      - name: Verify evaluation output
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path("smoke-results/har.json").read_text())
          matrix = result["confusion_matrix"]
          assert result["training_rows"] == 144
          assert result["validation_rows"] == 36
          assert sum(map(sum, matrix)) == 36
          correct = sum(row[i] for i, row in enumerate(matrix))
          assert abs(result["accuracy"] - correct / 36) < 1e-12
          assert set(result["important_top5"]) == {"sensor_x", "sensor_y"}
          PY
